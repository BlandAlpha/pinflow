appId: com.local.todo-tracker
productName: TodoTracker
copyright: Local-first personal todo manager

directories:
  output: release
  buildResources: resources

# 仅打包构建产物；生产依赖 (better-sqlite3 等) 由 electron-builder 自动带入
files:
  - app-build/**
  - package.json

# 关闭原生模块重建：本机无 MSVC 工具链，better-sqlite3 直接使用
# scripts/fetch-native.mjs 下载的官方预编译二进制（与 Electron ABI 匹配）
npmRebuild: false
buildDependenciesFromSource: false

asarUnpack:
  - "**/node_modules/better-sqlite3/**"

extraResources:
  - from: resources
    to: resources

win:
  icon: resources/icon.ico
  # 个人本地应用不做代码签名：关闭 rcedit，可避免打包时联网下载 winCodeSign
  #（本机缓存版本与 electron-builder 期望的不一致，且 GitHub 下载被拦截）。
  # 应用图标在运行时由 BrowserWindow.icon 设置，任务栏/窗口图标已正确显示。
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Todo Tracker
  artifactName: TodoTracker-${version}-setup.${ext}
