name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    # 两个平台都跑一遍：原生模块（better-sqlite3）、图标生成（iconutil）、
    # 打包配置的平台分支在 mac 上走的都是不同代码路径
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Node 22（ABI v127）：better-sqlite3 只为部分 ABI 提供官方预编译包，
      # v127 有、v115（Node 20）没有 —— 用 20 会回退到 node-gyp 本地编译，
      # 而 GitHub Windows runner 上的 VS 18 不被 @electron/node-gyp 的版本表识别，
      # 装依赖就直接失败（macOS 只是恰好有 Clang 才编译得过去）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build
