name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    # 两个平台都跑一遍：原生模块（better-sqlite3）、图标生成（iconutil）、
    # 打包配置的平台分支在 mac 上走的都是不同代码路径
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build
